<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Ridge Racer</title>
    <meta
      name="description"
      content="A fast Three.js racing game with arcade controls, obstacles, and score tracking."
    />
    <script type="module" crossorigin src="/assets/index-Dl8rjrQr.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-TCFToBxx.css">
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div class="start-screen" id="start-screen">
        <div class="start-screen__panel">
          <span class="hud__eyebrow">Ready to Race</span>
          <h2>Neon Ridge Racer</h2>
          <p>Start the game, then steer around obstacles and upload a photo onto your car.</p>
          <button id="start-game" type="button">Start Game</button>
        </div>
      </div>
      <div class="hud">
        <div class="hud__brand">
          <span class="hud__eyebrow">Three.js Arcade</span>
          <h1>Neon Ridge Racer</h1>
        </div>
        <div class="hud__stats">
          <div><span>Speed</span><strong id="speed">0</strong></div>
          <div><span>Distance</span><strong id="distance">0</strong></div>
          <div><span>Best</span><strong id="best">0</strong></div>
        </div>
        <div class="hud__help">
          <p>Move: <kbd>WASD</kbd> or <kbd>Arrow Keys</kbd></p>
          <p>Restart: <kbd>R</kbd></p>
        </div>
        <div class="hud__speed-control">
          <span>Obstacle Speed</span>
          <div class="hud__speed-row">
            <button id="obstacle-speed-down" type="button" aria-label="Decrease obstacle speed">-</button>
            <strong id="obstacle-speed-value">22</strong>
            <button id="obstacle-speed-up" type="button" aria-label="Increase obstacle speed">+</button>
          </div>
        </div>
        <div class="hud__photo-control">
          <span>Car Photo</span>
          <div class="hud__photo-row">
            <button id="car-photo-upload" type="button">Upload Photo</button>
            <button id="car-photo-clear" type="button">Clear</button>
            <input id="car-photo-input" type="file" accept="image/*" hidden />
          </div>
        </div>
        <div class="hud__music-control">
          <span>Background Music</span>
          <button id="music-toggle" type="button" aria-pressed="true">BGM On</button>
        </div>
        <button id="restart" type="button">Restart Race</button>
      </div>
      <div class="banner" id="banner">
        <strong>Ready</strong>
        <span>Press Start Game to begin racing.</span>
      </div>
      <div class="mobile-controls" aria-label="Mobile steering controls">
        <button id="mobile-left" class="mobile-controls__btn mobile-controls__btn--left" type="button" aria-label="Steer left">LEFT</button>
        <button id="mobile-right" class="mobile-controls__btn mobile-controls__btn--right" type="button" aria-label="Steer right">RIGHT</button>
      </div>
    </div>
  </body>
</html>
